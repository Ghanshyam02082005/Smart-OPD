  <title>Smart OPD - Intelligent Healthcare Queue Management</title>
  <link id="hospital-favicon" rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <script>
    (() => {
      const logoPattern = /^data:image\/(?:png|jpeg|webp);base64,/;
      const colors = ['--primary-50', '--primary-100', '--primary-200', '--primary-500', '--primary-600', '--primary-700', '--primary-900', '--primary-rgb', '--sidebar-bg', '--sidebar-hover', '--sidebar-text', '--parchi-primary', '--parchi-accent', '--parchi-soft-bg', '--parchi-soft-border', '--parchi-strong', '--parchi-rule', '--mdmh-blue', '--mdmh-cyan', '--mdmh-cyan-soft', '--mdmh-light', '--mdmh-border', '--mdmh-footer', '--tv-bg', '--tv-panel', '--tv-raised', '--tv-border', '--tv-muted'];
      try {
        const settings = JSON.parse(localStorage.getItem('smart_opd_settings') || '{}');
        const favicon = document.getElementById('hospital-favicon');
        if (favicon && logoPattern.test(settings.logoDataUrl || '')) {
          favicon.href = settings.logoDataUrl;
          favicon.type = settings.logoDataUrl.match(/^data:(image\/(?:png|jpeg|webp));/)?.[1] || 'image/png';
        }
        if (!logoPattern.test(settings.logoDataUrl || '')) return;
        const theme = settings.logoThemeColors;
        const validColor = color => typeof theme?.[color] === 'string' && (
          color === '--primary-rgb'
            ? /^\d{1,3}, \d{1,3}, \d{1,3}$/.test(theme[color])
            : CSS.supports('color', theme[color])
        );
        if (!theme || !colors.every(validColor)) {
          document.documentElement.classList.add('theme-pending');
          return;
        }
        colors.forEach(color => document.documentElement.style.setProperty(color, theme[color]));
      } catch (error) {
        document.documentElement.classList.add('theme-pending');
      }
    })();
  </script>
