<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#bgGrad)"/>
  <!-- Hospital Building & Tech Graphics -->
  <rect x="50" y="80" width="180" height="200" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="80" y="110" width="30" height="30" rx="4" fill="#3b82f6" opacity="0.2"/>
  <rect x="125" y="110" width="30" height="30" rx="4" fill="#3b82f6" opacity="0.2"/>
  <rect x="170" y="110" width="30" height="30" rx="4" fill="#3b82f6" opacity="0.2"/>
  
  <rect x="80" y="155" width="30" height="30" rx="4" fill="#3b82f6" opacity="0.2"/>
  <rect x="125" y="155" width="30" height="30" rx="4" fill="#3b82f6" opacity="0.2"/>
  <rect x="170" y="155" width="30" height="30" rx="4" fill="#3b82f6" opacity="0.2"/>
  
  <!-- Entrance door -->
  <rect x="120" y="220" width="40" height="60" rx="4" fill="#2563eb"/>
  <path d="M140 220v60" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Red Cross Badge Top -->
  <circle cx="140" cy="65" r="22" fill="#ef4444"/>
  <path d="M140 53v24M128 65h24" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Smart Queue Dashboard Floating Card -->
  <g transform="translate(250, 70)">
    <rect width="200" height="210" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.05))"/>
    <rect x="15" y="15" width="170" height="24" rx="6" fill="#eff6ff"/>
    <text x="25" y="31" font-family="sans-serif" font-size="11" font-weight="700" fill="#2563eb">LIVE PRIORITY QUEUE</text>
    
    <!-- Token Item 1 -->
    <rect x="15" y="50" width="170" height="42" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="25" y="70" font-family="sans-serif" font-size="12" font-weight="800" fill="#991b1b">OPD-030</text>
    <rect x="110" y="58" width="65" height="22" rx="11" fill="#ef4444"/>
    <text x="142" y="73" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">IMMEDIATE</text>
    
    <!-- Token Item 2 -->
    <rect x="15" y="100" width="170" height="42" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="25" y="120" font-family="sans-serif" font-size="12" font-weight="800" fill="#9a3412">OPD-021</text>
    <rect x="110" y="108" width="65" height="22" rx="11" fill="#f97316"/>
    <text x="142" y="123" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">SOON</text>

    <!-- Token Item 3 -->
    <rect x="15" y="150" width="170" height="42" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="25" y="170" font-family="sans-serif" font-size="12" font-weight="800" fill="#065f46">OPD-018</text>
    <rect x="110" y="158" width="65" height="22" rx="11" fill="#10b981"/>
    <text x="142" y="173" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">ROUTINE</text>
  </g>
</svg>
